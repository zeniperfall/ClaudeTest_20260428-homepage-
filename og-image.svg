<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#e8e8ed"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a4d8c"/>
      <stop offset="100%" stop-color="#00a3b4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00a3b4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00a3b4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="900" cy="500" rx="500" ry="300" fill="url(#glow)"/>

  <!-- Brand mark (diamond) -->
  <g transform="translate(140, 130)">
    <path d="M44 0 L88 44 L44 88 L0 44 Z M44 18 L66 44 L44 70 L22 44 Z" fill="url(#brand)"/>
  </g>

  <!-- Brand name -->
  <text x="244" y="190" font-family="Inter, 'Noto Sans KR', sans-serif" font-size="32" font-weight="600" fill="#1d1d1f" letter-spacing="2">SD BIOSENSOR</text>

  <!-- Main title -->
  <text x="140" y="340" font-family="Inter, 'Noto Sans KR', sans-serif" font-size="92" font-weight="700" fill="url(#brand)" letter-spacing="-2">STANDARD M10</text>

  <!-- Subtitle -->
  <text x="140" y="410" font-family="Inter, 'Noto Sans KR', sans-serif" font-size="36" font-weight="500" fill="#1d1d1f">검사실을 환자 곁으로.</text>
  <text x="140" y="455" font-family="Inter, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#6e6e73">차세대 POC 분자진단 시스템 — 30분 만에 검사실 수준의 결과를.</text>

  <!-- URL footer -->
  <text x="140" y="560" font-family="Inter, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6e6e73">sdbiosensor.kr</text>

  <!-- Decorative analyzer outline (right side) -->
  <g transform="translate(820, 280)" opacity="0.85">
    <rect x="0" y="0" width="240" height="160" rx="20" fill="#0a0a0a"/>
    <rect x="20" y="20" width="200" height="100" rx="10" fill="url(#brand)" opacity="0.85"/>
    <circle cx="220" cy="20" r="6" fill="#34c759"/>
    <rect x="20" y="135" width="200" height="14" rx="4" fill="#3a3a3f"/>
  </g>
</svg>
