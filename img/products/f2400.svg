<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-f24" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f7"/><stop offset="100%" stop-color="#e5e5ea"/>
    </linearGradient>
    <linearGradient id="body-f24" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#d2d2d7"/>
    </linearGradient>
    <linearGradient id="screen-f24" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f12"/><stop offset="100%" stop-color="#1d1d1f"/>
    </linearGradient>
    <linearGradient id="brand-f24" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a4d8c"/><stop offset="100%" stop-color="#00a3b4"/>
    </linearGradient>
    <radialGradient id="shadow-f24" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(0,0,0,0.2)"/><stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg-f24)"/>
  <ellipse cx="400" cy="535" rx="280" ry="22" fill="url(#shadow-f24)"/>

  <!-- Main body -->
  <g transform="translate(140, 120)">
    <rect x="0" y="0" width="520" height="360" rx="18" fill="url(#body-f24)" stroke="#c7c7cc" stroke-width="1"/>

    <!-- Big wide screen -->
    <rect x="30" y="30" width="280" height="170" rx="10" fill="url(#screen-f24)"/>
    <rect x="40" y="40" width="260" height="150" rx="6" fill="#0a0a0a"/>
    <!-- Header strip -->
    <rect x="50" y="50" width="100" height="6" rx="3" fill="url(#brand-f24)"/>
    <text x="50" y="78" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#a1a1a6" letter-spacing="1.5">RESULTS</text>
    <!-- Bar chart -->
    <rect x="50" y="92" width="20" height="50" fill="#00a3b4" opacity="0.85"/>
    <rect x="78" y="78" width="20" height="64" fill="#00a3b4"/>
    <rect x="106" y="100" width="20" height="42" fill="#00a3b4" opacity="0.7"/>
    <rect x="134" y="84" width="20" height="58" fill="#00a3b4" opacity="0.9"/>
    <rect x="162" y="92" width="20" height="50" fill="#00a3b4" opacity="0.8"/>
    <!-- Numeric readout -->
    <text x="200" y="115" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#f5f5f7">24/24</text>
    <text x="200" y="135" font-family="Inter, sans-serif" font-size="9" fill="#a1a1a6">SLOTS USED</text>

    <!-- Right side: cassette tray -->
    <rect x="340" y="30" width="150" height="280" rx="10" fill="#e8e8ed" stroke="#c7c7cc" stroke-width="1"/>
    <text x="365" y="48" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#6e6e73" letter-spacing="1">TRAY</text>
    <!-- 8 cassettes in 2 columns -->
    <g fill="#fff" stroke="#c7c7cc" stroke-width="1">
      <rect x="350" y="60" width="58" height="55" rx="3"/>
      <rect x="416" y="60" width="58" height="55" rx="3"/>
      <rect x="350" y="125" width="58" height="55" rx="3"/>
      <rect x="416" y="125" width="58" height="55" rx="3"/>
      <rect x="350" y="190" width="58" height="55" rx="3"/>
      <rect x="416" y="190" width="58" height="55" rx="3"/>
    </g>
    <!-- Indicator dots on cassettes -->
    <circle cx="362" cy="74" r="3" fill="#34c759"/>
    <circle cx="428" cy="74" r="3" fill="#34c759"/>
    <circle cx="362" cy="139" r="3" fill="#34c759"/>
    <circle cx="428" cy="139" r="3" fill="#0071e3"/>
    <circle cx="362" cy="204" r="3" fill="#0071e3"/>
    <circle cx="428" cy="204" r="3" fill="#a1a1a6"/>
    <!-- Test strip lines on each cassette -->
    <rect x="358" y="92" width="42" height="2" fill="url(#brand-f24)"/>
    <rect x="424" y="92" width="42" height="2" fill="url(#brand-f24)"/>
    <rect x="358" y="157" width="42" height="2" fill="url(#brand-f24)" opacity="0.5"/>
    <rect x="424" y="157" width="42" height="2" fill="url(#brand-f24)" opacity="0.5"/>

    <!-- Status LED -->
    <circle cx="490" cy="340" r="6" fill="#34c759">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="350" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f" letter-spacing="2">SD BIOSENSOR</text>
  </g>

  <text x="400" y="540" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="3">STANDARD F2400</text>
</svg>
