    <radialGradient id="shadow-e" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="rgba(0,0,0,0.18)"/><stop offset="100%" stop-color="rgba(0,0,0,0)"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-e)"/>
  <ellipse cx="400" cy="540" rx="280" ry="18" fill="url(#shadow-e)"/>

  <!-- 96-well plate with rotation -->
  <g transform="translate(140, 140) rotate(-2)">
    <rect x="0" y="0" width="520" height="340" rx="20" fill="url(#plate-e)" stroke="#a1a1a6" stroke-width="1"/>
    <!-- Top label -->
    <rect x="0" y="0" width="520" height="36" rx="20" fill="#fafafa" stroke="#e9e9ec" stroke-width="1"/>
    <rect x="0" y="18" width="520" height="18" fill="#fafafa" stroke="#e9e9ec" stroke-width="1"/>
    <text x="20" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1d1d1f" letter-spacing="2">STANDARD E · ELISA</text>
    <text x="380" y="24" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#6e6e73" letter-spacing="1">96 WELLS · LOT 26041A</text>
  </g>

  <!-- Wells: 8 rows x 12 cols, rendered after the plate so they sit on top -->
  <g transform="translate(140, 140) rotate(-2)">
    <g transform="translate(40, 60)">
      <!-- Row labels -->
      <g font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#6e6e73">
