  <defs>
    <linearGradient id="bg-e" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f5f5f7"/><stop offset="100%" stop-color="#e5e5ea"/></linearGradient>
    <linearGradient id="plate-e" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#d2d2d7"/></linearGradient>
    <radialGradient id="well-blue" cx="0.35" cy="0.35" r="0.6"><stop offset="0%" stop-color="#c8e8ec"/><stop offset="100%" stop-color="#0a4d8c"/></radialGradient>
    <radialGradient id="well-teal" cx="0.35" cy="0.35" r="0.6"><stop offset="0%" stop-color="#c8e8e8"/><stop offset="100%" stop-color="#00a3b4"/></radialGradient>
    <radialGradient id="well-red" cx="0.35" cy="0.35" r="0.6"><stop offset="0%" stop-color="#ffd6dc"/><stop offset="100%" stop-color="#d62b3e"/></radialGradient>
    <radialGradient id="well-yellow" cx="0.35" cy="0.35" r="0.6"><stop offset="0%" stop-color="#fff5cc"/><stop offset="100%" stop-color="#f0c020"/></radialGradient>
