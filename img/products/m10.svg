<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-m10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#e5e5ea"/>
    </linearGradient>
    <linearGradient id="screen-m10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#222226"/>
    </linearGradient>
    <linearGradient id="body-m10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8de"/>
    </linearGradient>
    <linearGradient id="brand-m10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a4d8c"/>
      <stop offset="100%" stop-color="#00a3b4"/>
    </linearGradient>
    <radialGradient id="shadow-m10" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(0,0,0,0.18)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg-m10)"/>
  <ellipse cx="400" cy="540" rx="240" ry="20" fill="url(#shadow-m10)"/>

  <g transform="translate(280, 100)">
    <!-- Screen unit -->
    <rect x="0" y="0" width="240" height="280" rx="22" fill="url(#screen-m10)"/>
    <rect x="14" y="14" width="212" height="252" rx="14" fill="#0a0a0a"/>
    <!-- Status bar -->
    <circle cx="34" cy="38" r="5" fill="#34c759"/>
    <text x="48" y="44" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#f5f5f7" letter-spacing="2">RUNNING</text>
    <!-- PCR amplification curves -->
    <path d="M28 180 Q 60 178, 80 168 T 130 130 T 200 80" stroke="#00d4e6" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M28 200 Q 60 198, 80 192 T 130 170 T 200 130" stroke="#34c759" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <line x1="28" y1="80" x2="28" y2="220" stroke="#3a3a3f" stroke-width="1"/>
    <line x1="28" y1="220" x2="200" y2="220" stroke="#3a3a3f" stroke-width="1"/>
    <!-- Readout -->
    <text x="28" y="252" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="#f5f5f7" letter-spacing="-0.5">Ct 24.8</text>
  </g>

  <g transform="translate(220, 380)">
    <!-- Base -->
    <rect x="0" y="0" width="360" height="120" rx="18" fill="url(#body-m10)" stroke="#c7c7cc" stroke-width="1"/>
    <!-- Cartridge slot -->
    <rect x="60" y="38" width="240" height="44" rx="6" fill="#1d1d1f"/>
    <rect x="70" y="46" width="220" height="28" rx="4" fill="#2c2c2e"/>
    <!-- Cartridge protrusion -->
    <rect x="120" y="20" width="120" height="22" rx="3" fill="#fff" stroke="#c7c7cc" stroke-width="1"/>
    <rect x="135" y="26" width="90" height="10" rx="2" fill="url(#brand-m10)"/>
    <!-- LED indicator -->
    <circle cx="324" cy="60" r="6" fill="#34c759">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <!-- Vent slits -->
    <line x1="20" y1="100" x2="40" y2="100" stroke="#a1a1a6" stroke-width="2"/>
    <line x1="46" y1="100" x2="66" y2="100" stroke="#a1a1a6" stroke-width="2"/>
    <line x1="294" y1="100" x2="314" y2="100" stroke="#a1a1a6" stroke-width="2"/>
    <line x1="320" y1="100" x2="340" y2="100" stroke="#a1a1a6" stroke-width="2"/>
  </g>

  <text x="400" y="540" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="3">STANDARD M10</text>
</svg>
