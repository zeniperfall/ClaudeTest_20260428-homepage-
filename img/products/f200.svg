<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-f2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f5f5f7"/><stop offset="100%" stop-color="#e5e5ea"/></linearGradient>
    <linearGradient id="body-f2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#d2d2d7"/></linearGradient>
    <linearGradient id="screen-f2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f0f12"/><stop offset="100%" stop-color="#1d1d1f"/></linearGradient>
    <linearGradient id="brand-f2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0a4d8c"/><stop offset="100%" stop-color="#00a3b4"/></linearGradient>
    <radialGradient id="shadow-f2" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="rgba(0,0,0,0.2)"/><stop offset="100%" stop-color="rgba(0,0,0,0)"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-f2)"/>
  <ellipse cx="400" cy="525" rx="220" ry="20" fill="url(#shadow-f2)"/>

  <g transform="translate(220, 110)">
    <rect x="0" y="0" width="360" height="380" rx="18" fill="url(#body-f2)" stroke="#c7c7cc" stroke-width="1"/>

    <!-- Compact screen, centered -->
    <rect x="50" y="40" width="260" height="180" rx="10" fill="url(#screen-f2)"/>
    <rect x="60" y="50" width="240" height="160" rx="6" fill="#0a0a0a"/>

    <text x="74" y="80" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#34c759" letter-spacing="2">READY</text>

    <!-- Result panel mock -->
    <rect x="74" y="98" width="192" height="40" rx="4" fill="#1c1c1e"/>
    <text x="84" y="116" font-family="Inter, sans-serif" font-size="10" fill="#a1a1a6" letter-spacing="1">CRP</text>
    <text x="84" y="130" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#f5f5f7">5.2 mg/L</text>

    <rect x="74" y="148" width="192" height="40" rx="4" fill="#1c1c1e"/>
    <text x="84" y="166" font-family="Inter, sans-serif" font-size="10" fill="#a1a1a6" letter-spacing="1">PROCALCITONIN</text>
    <text x="84" y="180" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#f5f5f7">0.18 ng/mL</text>

    <!-- Cassette slot -->
    <rect x="100" y="260" width="160" height="32" rx="4" fill="#1d1d1f"/>
    <rect x="120" y="240" width="120" height="22" rx="3" fill="#fff" stroke="#c7c7cc" stroke-width="1"/>
    <rect x="135" y="246" width="90" height="10" rx="1" fill="url(#brand-f2)"/>

    <!-- Brand mark -->
    <text x="50" y="350" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f" letter-spacing="2">SD BIOSENSOR</text>
    <circle cx="320" cy="346" r="5" fill="#34c759"/>
  </g>

  <text x="400" y="540" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="3">STANDARD F200</text>
</svg>
