<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-q" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f5f5f7"/><stop offset="100%" stop-color="#e5e5ea"/></linearGradient>
    <linearGradient id="cassette-q" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e8e8ed"/></linearGradient>
    <linearGradient id="brand-q" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0a4d8c"/><stop offset="100%" stop-color="#00a3b4"/></linearGradient>
    <radialGradient id="shadow-q" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="rgba(0,0,0,0.18)"/><stop offset="100%" stop-color="rgba(0,0,0,0)"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-q)"/>
  <ellipse cx="400" cy="540" rx="280" ry="18" fill="url(#shadow-q)"/>

  <!-- Main cassette tilted -->
  <g transform="translate(150, 180) rotate(-3)">
    <rect x="0" y="0" width="500" height="200" rx="14" fill="url(#cassette-q)" stroke="#c7c7cc" stroke-width="1"/>

    <!-- Brand band -->
    <rect x="0" y="0" width="500" height="40" rx="14" fill="url(#brand-q)"/>
    <rect x="0" y="20" width="500" height="20" fill="url(#brand-q)"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#fff" letter-spacing="2">STANDARD Q</text>
    <text x="20" y="58" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#0a4d8c" letter-spacing="2">COVID-19 Ag</text>

    <!-- Result window -->
    <rect x="200" y="80" width="280" height="80" rx="6" fill="#0a0a0a"/>
    <rect x="208" y="88" width="264" height="64" rx="4" fill="#1d1d1f"/>
    <!-- C and T labels -->
    <text x="220" y="106" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#a1a1a6" letter-spacing="1">C</text>
    <text x="220" y="138" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#a1a1a6" letter-spacing="1">T</text>
    <!-- Lines (positive: both lines visible) -->
    <rect x="240" y="100" width="220" height="3" fill="#d62b3e"/>
    <rect x="240" y="132" width="220" height="3" fill="#d62b3e" opacity="0.6"/>
    <text x="240" y="116" font-family="Inter, sans-serif" font-size="8" fill="#a1a1a6">Control</text>
    <text x="240" y="148" font-family="Inter, sans-serif" font-size="8" fill="#a1a1a6">Test</text>

    <!-- Sample well -->
    <circle cx="100" cy="120" r="22" fill="#fff" stroke="#0a4d8c" stroke-width="2"/>
    <circle cx="100" cy="120" r="14" fill="url(#brand-q)" opacity="0.7"/>
    <text x="100" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#6e6e73" letter-spacing="1">SAMPLE</text>
  </g>

  <!-- Buffer dropper -->
  <g transform="translate(620, 80)">
    <rect x="0" y="0" width="40" height="120" rx="20" fill="#fff" stroke="#c7c7cc" stroke-width="1"/>
    <rect x="14" y="0" width="12" height="50" fill="url(#brand-q)"/>
    <ellipse cx="20" cy="125" rx="3" ry="5" fill="url(#brand-q)" opacity="0.7"/>
  </g>

  <text x="400" y="500" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="3">STANDARD Q · LFA RAPID TEST</text>
</svg>
